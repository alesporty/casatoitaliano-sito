# Rigenera il sito una volta al giorno alle 12:17 UTC (13:17 italiane d'inverno, 14:17 d'estate): i video escono alle 12:00 UTC.
# Dal 30/10/2026 build.py chiede a YouTube se ogni video è pubblico: un'uscita spostata in Studio non porta più in home un video privato
# (campo `uscita` in dati/video/<slug>.json, vedi build.py). Aggiunto il 27/10/2026; giornaliero da subito su richiesta di Alessandro.
name: Uscite programmate
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: uscite
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rigenera il sito
        run: python3 build.py
      - name: Pubblica se qualcosa è cambiato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "niente da pubblicare"; exit 0; fi
          git config user.name "casato-uscite"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Uscita programmata: episodi in home ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "build di Pages non richiesta (parte comunque dal push)"
